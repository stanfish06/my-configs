onboarding = false

[theme]
name = "gruvbox"

[ui]
pane_gaps = false
hide_tab_bar_when_single_tab = true
tab_bar_position = "bottom"
copy_on_select = false
sidebar_start_collapsed = true
sidebar_width = 20
window_title = "{workspace}: {terminal_title}"

# Show Claude's session summary (its terminal title) instead of the agent name
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.sound.agents]
claude = "off"

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
detach = "prefix+d"
previous_workspace = "prefix+{"
next_workspace = "prefix+}"

# zoxide picker: focus or create a workspace in the chosen dir
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "herdr-z"
width = "70%"
height = "60%"

# close all other panes in the current tab (emacs C-x 1)
[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "herdr-only"
