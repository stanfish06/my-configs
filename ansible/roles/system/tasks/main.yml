# root-level setup; skipped on hosts run with --skip-tags sudo
- name: system layer
  become: true
  block:
    - name: generate locale
      ansible.builtin.shell: locale -a | grep -qix "{{ locale | replace('UTF-8', 'utf8') }}" || locale-gen {{ locale }}
      register: locale_gen
      changed_when: "'Generating' in locale_gen.stdout"
      when: ansible_os_family == 'Debian'

    - name: set default locale
      ansible.builtin.copy:
        dest: "{{ '/etc/default/locale' if ansible_os_family == 'Debian' else '/etc/locale.conf' }}"
        content: "LANG={{ locale }}\n"
        mode: "0644"

    - name: read timezone
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: tz_now
      changed_when: false

    - name: set timezone
      ansible.builtin.command: timedatectl set-timezone {{ timezone }}
      when: tz_now.stdout != timezone

    # tailscale isn't in the distro archives; same paths as tailscale's install script
    - name: tailscale apt key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"
      when: ansible_os_family == 'Debian'

    - name: tailscale apt repo
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.tailscale-keyring.list"
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"
      register: tailscale_repo
      when: ansible_os_family == 'Debian'

    # apt-get through provision-step instead of the apt module, which prints nothing until it returns
    - name: apt lists age
      ansible.builtin.stat:
        path: /var/lib/apt/lists
      register: apt_lists
      when: ansible_os_family == 'Debian'

    - name: refresh apt cache
      ansible.builtin.command: "{{ provision_step }} apt-update apt-get update -o DPkg::Lock::Timeout=600"
      register: apt_up
      until: apt_up.rc == 0
      retries: 20
      delay: 15
      when:
        - ansible_os_family == 'Debian'
        - tailscale_repo is changed or (ansible_date_time.epoch | int - apt_lists.stat.mtime) > 3600

    # download first so the transfer shows up in the provision log; the install below then reads the cache
    - name: download system packages
      ansible.builtin.command: >-
        {{ provision_step }} apt-download
        apt-get install --download-only -y -o DPkg::Lock::Timeout=600 {{ system_packages | join(' ') }}
      register: apt_dl
      until: apt_dl.rc == 0
      retries: 20
      delay: 15
      changed_when: "'Get:' in apt_dl.stdout"
      when: ansible_os_family == 'Debian'

    - name: download system packages
      ansible.builtin.command: "{{ provision_step }} pacman-download pacman -Sw --needed --noconfirm {{ system_packages | join(' ') }}"
      register: pacman_dl
      until: pacman_dl.rc == 0
      retries: 20
      delay: 15
      changed_when: "'downloading' in pacman_dl.stdout"
      when: ansible_os_family == 'Archlinux'

    - name: install system packages
      ansible.builtin.package:
        name: "{{ system_packages }}"
        state: present

    - name: enable daemons
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ system_services }}"

    - name: login shell and docker group
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: "{{ login_shell }}"
        groups: docker
        append: true
