# docker sandboxes (sbx) run agents in microVMs: docker's apt repo for docker-sbx, /dev/kvm for the user
- name: sandbox packages
  ansible.builtin.set_fact:
    sandbox_packages: [docker-sbx, docker-buildx, docker-compose-v2]

- name: docker sandboxes
  become: true
  block:
    - name: docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: docker apt repo
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
      register: docker_repo

    - name: refresh apt cache for the docker repo
      ansible.builtin.command: "{{ provision_step }} apt-update apt-get update -o DPkg::Lock::Timeout=600"
      when: docker_repo is changed

    # docker.io comes from the system role; buildx and compose are the distro builds that match it.
    # download through provision-step so the transfer shows up in the provision log
    - name: download sbx, buildx, compose
      ansible.builtin.command: >-
        {{ provision_step }} sbx-download
        apt-get install --download-only -y -o DPkg::Lock::Timeout=600 {{ sandbox_packages | join(' ') }}
      register: sbx_dl
      changed_when: "'Get:' in sbx_dl.stdout"

    - name: install sbx, buildx, compose
      ansible.builtin.apt:
        name: "{{ sandbox_packages }}"

    - name: kvm group
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: kvm
        append: true

- name: check /dev/kvm
  ansible.builtin.stat:
    path: /dev/kvm
  register: kvm

- name: no /dev/kvm
  ansible.builtin.debug:
    msg: "/dev/kvm missing: sbx needs nested virtualization (aws: c8i/m8i/r8i) or a metal instance"
  when: not kvm.stat.exists
