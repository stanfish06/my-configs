chezmoi_email: zhiyuanyu06@gmail.com
chezmoi_has_conda: false

github_user: stanfish06
my_configs_repo: my-configs
dot_agents_repo: dot-agents
skillquarium_repo: skillquarium
apimanac_repo: APImanac

timezone: America/New_York
locale: en_US.UTF-8
login_shell: /usr/bin/zsh

zsh_custom_plugins:
  zsh-vi-mode: https://github.com/jeffreytse/zsh-vi-mode.git
  zsh-autosuggestions: https://github.com/zsh-users/zsh-autosuggestions.git
  zsh-syntax-highlighting: https://github.com/zsh-users/zsh-syntax-highlighting.git

# slow steps run through provision-step, which copies their output to provision_log;
# `cloud provision` tails this file (path also in cloud/cloud: PROVISION_LOG)
provision_log: "{{ ansible_user_dir }}/.local/state/provision/provision.log"
provision_step: "{{ ansible_user_dir }}/.local/libexec/provision-step"

mise_bootstrap_tools:
  - bun
  - node
  - uv
