[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]

[settings.npm]
bun = true

[settings.node]
# precompiled binaries; nixos runs them via nix-ld
compile = false

[tools]
# runtimes
uv = "latest"
node = "latest"
bun = "latest"
neovim = "nightly"
# lsp / formatters / linters
biome = "latest"
markdownlint-cli2 = "latest"
prettier = "latest"
ruff = "latest"
stylua = "latest"
shellcheck = "latest"
"aqua:LuaLS/lua-language-server" = "latest"
"npm:markdown-toc" = "latest"
# standalone cli tools
atuin = "latest"
tree-sitter = "latest"
bat = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
jq = "latest"
ripgrep = "latest"
ast-grep = "latest"
yq = "latest"
zoxide = "latest"
"aqua:modem-dev/hunk" = "latest"

[tools."npm:pyright"]
version = "latest"
minimum_release_age = "0s"

[tools."npm:typescript-language-server"]
version = "latest"
minimum_release_age = "0s"

[tools."npm:@openai/codex"]
version = "latest"
minimum_release_age = "0s"

[tools."npm:@kilocode/cli"]
version = "latest"
minimum_release_age = "0s"

[tools."npm:opencode-ai"]
version = "latest"
minimum_release_age = "0s"

[tools."npm:opensrc"]
version = "latest"
minimum_release_age = "0s"

[tools."npm:@fission-ai/openspec"]
version = "latest"
minimum_release_age = "0s"

[tasks.claude-install]
description = "Install/upgrade Claude Code via native installer"
run = "curl -fsSL https://claude.ai/install.sh | bash -s latest"

[tasks.antigravity-cli-install]
description = "Install/upgrade Antigravity CLI via native installer"
run = "rm -f ~/.local/bin/agy && curl -fsSL https://antigravity.google/cli/install.sh | bash"

[tasks.fx-install]
description = "Install/upgrade fx via native installer"
run = "curl -fsSL https://fx.sh/setup.sh | bash"

[tasks.pi-install]
description = "Install/upgrade pi via native installer"
run = "curl -fsSL https://pi.dev/install.sh | sh"

[tasks.upgrade-all]
description = "Upgrade all tools"
run = [
  "mise outdated",
  "mise upgrade",
  "mise run claude-install ::: antigravity-cli-install ::: fx-install ::: pi-install",
  "mise prune --yes",
]
