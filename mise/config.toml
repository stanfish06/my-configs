[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]
npm.package_manager = "bun"
# precompiled binaries; nixos runs them via nix-ld
node.compile = false

[tools]
# support
usage = "latest"
chezmoi = "latest"
# runtimes
uv = "latest"
node = "latest"
bun = "latest"
pnpm = "latest"
neovim = "nightly"
# lsp / formatters / linters
biome = "latest"
markdownlint-cli2 = "latest"
prettier = "latest"
ruff = "latest"
stylua = "latest"
shellcheck = "latest"
"aqua:LuaLS/lua-language-server" = "latest"
"npm:markdown-toc" = "latest"
# standalone cli tools
atuin = "latest"
tree-sitter = "latest"
bat = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
jq = "latest"
ripgrep = "latest"
ast-grep = "latest"
yq = "latest"
zoxide = "latest"
worktrunk = "latest"
fx = "latest"
d2 = "latest"
"aqua:modem-dev/hunk" = "latest"
# agents
opencode = "latest"
pi = "latest"
"npm:pyright" = { version = "latest", minimum_release_age = "0s" }
"npm:typescript-language-server" = { version = "latest", minimum_release_age = "0s" }
"npm:@openai/codex" = { version = "latest", minimum_release_age = "0s" }
"npm:opensrc" = { version = "latest", minimum_release_age = "0s" }
"npm:agent-browser" = { version = "latest", minimum_release_age = "0s" }
"npm:@fission-ai/openspec" = { version = "latest", minimum_release_age = "0s" }
"npm:@deepseek-ai/dsh" = { version = "alpha", minimum_release_age = "0s" }

[tasks.claude-install]
description = "Install/upgrade Claude Code via native installer"
run = "curl -fsSL https://claude.ai/install.sh | bash -s latest"

[tasks.antigravity-cli-install]
description = "Install/upgrade Antigravity CLI via native installer"
run = "rm -f ~/.local/bin/agy && curl -fsSL https://antigravity.google/cli/install.sh | bash"

[tasks.tpm-install]
description = "Install tmux plugin manager (plugins: prefix+I inside tmux)"
run = "[ -d ~/.tmux/plugins/tpm ] || git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"

[tasks.upgrade-all]
description = "Upgrade all tools"
depends = ["claude-install", "antigravity-cli-install", "tpm-install"]
run = ["mise upgrade", "mise prune --yes"]
